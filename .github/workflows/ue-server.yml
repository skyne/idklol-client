# ─── UE Dedicated Server — Multi-stage Docker Build & Push ──────────────────
#
# OVERVIEW
# --------
# This workflow builds the UE dedicated server using a multi-stage Dockerfile.
# The build happens entirely within Docker using ghcr.io/epicgames/unreal-engine:dev-5.5
#
# The workflow:
#   1. Sets up Docker Buildx for efficient multi-stage builds
#   2. Builds the Docker image (which compiles and packages the server internally)
#   3. Pushes the image to GitHub Container Registry (ghcr.io)
#
# REQUIRED RUNNER SETUP
# ---------------------
#   - Self-hosted or GitHub-hosted runner (Linux x86_64 recommended)
#   - Docker Engine installed
#   - Sufficient disk space for UE build (~50GB+ recommended)
#   - Runner user in `docker` group
#
# REQUIRED PERMISSIONS
# ---------------------
#   - The workflow needs permission to pull ghcr.io/epicgames/unreal-engine:dev-5.5
#   - You may need to authenticate with Epic Games' container registry
#
# IMAGE TAG STRATEGY
# ------------------
#   push to main  →  ghcr.io/<owner>/ue-server:latest + :<short-sha>
#   tag  v*.*.*   →  ghcr.io/<owner>/ue-server:<semver> + :latest

name: UE Server — Build & Push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      # Only re-build when game source or packaging config changes
      - "Source/**"
      - "Config/**"
      - "Plugins/**"
      - "TPSCoreMechanics.uproject"
      - "Dockerfile.server"
      - ".github/workflows/ue-server.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push Docker image to ghcr.io"
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ue-server

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: [self-hosted, ue5-linux]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false   # No LFS in this repo; flip to true if you add binary assets

      # ── Set up Docker Buildx ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Docker metadata (tags + labels) ──────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Decide whether to push ────────────────────────────────────────────
      - name: Should push image?
        id: push-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.push_image }}" = "false" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Log in to GHCR ────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: steps.push-check.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build (and optionally push) Docker image ─────────────────────────
      # The Dockerfile handles both building UE server and packaging into runtime image
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: ${{ steps.push-check.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored locally on the runner for faster rebuilds
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ── Rotate build cache (prevents unbounded growth) ───────────────────
      - name: Rotate build cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
