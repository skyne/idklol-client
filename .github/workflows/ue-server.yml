# ─── UE Dedicated Server — Multi-stage Docker Build & Push ──────────────────
#
# OVERVIEW
# --------
# This workflow builds the UE dedicated server using a multi-stage Dockerfile.
# The build happens entirely within Docker using ghcr.io/epicgames/unreal-engine:dev-5.5
#
# The workflow:
#   1. Reuses the host Docker image store for the Unreal base image
#   2. Builds the Docker image (which compiles and packages the server internally)
#   3. Pushes the image to GitHub Container Registry (ghcr.io)
#
# REQUIRED RUNNER SETUP
# ---------------------
#   - Self-hosted Linux x86_64 runner with label "ue5-linux"
#   - Docker Engine installed
#   - At least 150GB free disk space
#   - Runner user in `docker` group
#
# REQUIRED SECRETS
# ----------------
#   - EPIC_GHCR_TOKEN: GitHub PAT with package read/write access, from an
#     account that has accepted Epic's EULA at
#     https://github.com/EpicGames/Signup
#     This token is used for both pulling Epic's private base image and
#     pushing this repo's GHCR image.
#   - INFRA_REPO_TOKEN: token with permission to dispatch workflows in
#     skyne/idklol-infra (used for automated promotion PR creation).
#
# OPTIONAL REPOSITORY VARIABLE
# ----------------------------
#   - INFRA_AUTOMERGE: set to "true" to request auto-merge on infra promotion PRs.
#
# IMAGE TAG STRATEGY
# ------------------
#   push to main  →  ghcr.io/<owner>/ue-server:latest + :<short-sha>
#   tag  v*.*.*   →  ghcr.io/<owner>/ue-server:<semver> + :latest

name: UE Server — Build & Push

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      # Only re-build when game source or packaging config changes
      - "Source/**"
      - "Config/**"
      - "Plugins/**"
      - "TPSCoreMechanics.uproject"
      - "Dockerfile.server"
      - ".github/workflows/ue-server.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push Docker image to ghcr.io"
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ue-server
  TURBOLINK_LIBRARIES_URL: https://github.com/thejinchao/turbolink-libraries/releases/download/v1.3.1/turbolink-libraries.ue54.zip

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: [self-hosted, ue5-linux]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false   # No LFS in this repo; flip to true if you add binary assets

      # ── Free disk space ─────────────────────────────────────────────────
      - name: Free disk space
        run: |
          docker container prune -f || true
          docker builder prune -af --filter 'until=24h' || true
          echo "Available disk: $(df -h / | tail -1 | awk '{print $4}')"

      # ── Log in to GHCR for both base-image pulls and final push ─────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.EPIC_GHCR_TOKEN }}

      # ── Ensure Epic base image is present in host Docker storage ─────────
      - name: Ensure Epic UE base image is available locally
        run: |
          if docker image inspect ghcr.io/epicgames/unreal-engine:dev-5.7-slim >/dev/null 2>&1; then
            echo "Epic UE base image already present in host Docker storage"
          else
            docker pull ghcr.io/epicgames/unreal-engine:dev-5.7-slim
          fi

      # ── Restore gitignored TurboLink third-party binaries ───────────────
      # The zip is cached on the runner at $HOME/.cache/turbolink/ using a
      # version-derived filename so re-downloads only happen when the URL changes.
      - name: Ensure TurboLink third-party libraries are available
        shell: bash
        run: |
          set -euo pipefail

          third_party_root="Plugins/TurboLink/Source/ThirdParty"
          required_libs=(
            "$third_party_root/grpc/lib/linux/Release/libgrpc++.a"
            "$third_party_root/protobuf/lib/linux/Release/libprotobuf.a"
            "$third_party_root/abseil/lib/linux/Release/libabsl_base.a"
            "$third_party_root/re2/lib/linux/Release/libre2.a"
          )

          missing=0
          for lib_path in "${required_libs[@]}"; do
            if [[ ! -f "$lib_path" ]]; then
              missing=1
              break
            fi
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "TurboLink Linux third-party libraries already present in workspace"
            exit 0
          fi

          command -v curl >/dev/null 2>&1 || { echo "curl is required on the runner"; exit 1; }
          command -v unzip >/dev/null 2>&1 || { echo "unzip is required on the runner"; exit 1; }

          # Persistent runner-local cache keyed by <release-tag>-<filename>
          # so the cached file is automatically replaced when the URL changes.
          url_version=$(basename "$(dirname "$TURBOLINK_LIBRARIES_URL")")
          url_basename=$(basename "$TURBOLINK_LIBRARIES_URL")
          cache_dir="$HOME/.cache/turbolink"
          archive_path="$cache_dir/${url_version}-${url_basename}"
          mkdir -p "$cache_dir"

          if [[ -f "$archive_path" ]]; then
            echo "Using cached TurboLink libraries: $archive_path"
          else
            echo "Downloading TurboLink libraries to runner cache..."
            tmp_archive="${archive_path}.tmp"
            curl -L --fail --retry 3 --retry-all-errors "$TURBOLINK_LIBRARIES_URL" -o "$tmp_archive"
            mv "$tmp_archive" "$archive_path"
            echo "Cached at: $archive_path"
          fi

          extract_root="$RUNNER_TEMP/turbolink-libraries"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          unzip -q "$archive_path" -d "$extract_root"

          marker_file=$(find "$extract_root" -type f -path '*/grpc/lib/linux/Release/libgrpc++.a' -print -quit)
          if [[ -z "$marker_file" ]]; then
            echo "TurboLink dependency archive did not contain Linux grpc libraries"
            exit 1
          fi

          source_root=$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$marker_file")")")")")
          for dep_dir in abseil grpc protobuf re2; do
            if [[ ! -d "$source_root/$dep_dir" ]]; then
              echo "TurboLink dependency archive missing $dep_dir"
              exit 1
            fi
            mkdir -p "$third_party_root/$dep_dir"
            cp -a "$source_root/$dep_dir/." "$third_party_root/$dep_dir/"
          done

      # ── Docker metadata (tags + labels) ──────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Decide whether to push ────────────────────────────────────────────
      - name: Should push image?
        id: push-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.push_image }}" = "false" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Build with host Docker cache and optionally push tags ────────────
      # This uses the host daemon directly so local images, including the
      # large Unreal base image, are reused instead of being re-pulled into a
      # separate Buildx container cache.
      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tags <<< "${{ steps.meta.outputs.tags }}"
          mapfile -t labels <<< "${{ steps.meta.outputs.labels }}"

          build_args=(--file ./Dockerfile.server --pull=false)

          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              build_args+=(--tag "$tag")
            fi
          done

          for label in "${labels[@]}"; do
            if [ -n "$label" ]; then
              build_args+=(--label "$label")
            fi
          done

          DOCKER_BUILDKIT=1 docker build "${build_args[@]}" .

      - name: Push Docker image
        if: steps.push-check.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

  promote-infra:
    name: Promote UE image to infra
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Trigger idklol-infra UE promotion workflow
        env:
          GH_TOKEN: ${{ secrets['INFRA_REPO_TOKEN'] }}
          UE_SHA: ${{ github.sha }}
          INFRA_AUTOMERGE: ${{ vars.INFRA_AUTOMERGE }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::INFRA_REPO_TOKEN is not configured; skipped infra promotion trigger."
            exit 0
          fi

          automerge="false"
          if [ "${INFRA_AUTOMERGE:-}" = "true" ]; then
            automerge="true"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/skyne/idklol-infra/actions/workflows/promote-ue-image.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"ue_sha\":\"${UE_SHA}\",\"tfvars_file\":\"prod.public.tfvars\",\"automerge\":\"${automerge}\"}}"
