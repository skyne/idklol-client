# ─── UE Dedicated Server — Multi-stage Docker Build & Push ──────────────────
#
# OVERVIEW
# --------
# This workflow builds the UE dedicated server using a multi-stage Dockerfile.
# The build happens entirely within Docker using ghcr.io/epicgames/unreal-engine:dev-5.5
#
# The workflow:
#   1. Sets up Docker Buildx for efficient multi-stage builds
#   2. Builds the Docker image (which compiles and packages the server internally)
#   3. Pushes the image to GitHub Container Registry (ghcr.io)
#
# REQUIRED RUNNER SETUP
# ---------------------
#   - Self-hosted Linux x86_64 runner with label "ue5-linux"
#   - Docker Engine + docker-buildx-plugin installed
#   - At least 150GB free disk space
#   - Runner user in `docker` group
#
# REQUIRED SECRETS
# ----------------
#   - EPIC_GHCR_TOKEN: GitHub PAT with read:packages scope, from an account
#     that has accepted Epic's EULA at https://github.com/EpicGames/Signup
#   - GITHUB_TOKEN: Automatic, used to push to this repo's GHCR
#
# IMAGE TAG STRATEGY
# ------------------
#   push to main  →  ghcr.io/<owner>/ue-server:latest + :<short-sha>
#   tag  v*.*.*   →  ghcr.io/<owner>/ue-server:<semver> + :latest

name: UE Server — Build & Push

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      # Only re-build when game source or packaging config changes
      - "Source/**"
      - "Config/**"
      - "Plugins/**"
      - "TPSCoreMechanics.uproject"
      - "Dockerfile.server"
      - ".github/workflows/ue-server.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push Docker image to ghcr.io"
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ue-server

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: [self-hosted, ue5-linux]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false   # No LFS in this repo; flip to true if you add binary assets

      # ── Free disk space ─────────────────────────────────────────────────
      - name: Free disk space
        run: |
          docker system prune -f --volumes || true
          echo "Available disk: $(df -h / | tail -1 | awk '{print $4}')"

      # ── Set up Docker Buildx ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      # ── Pull Epic base image (needs separate auth) ──────────────────────
      # Epic's private GHCR and our push target share ghcr.io, so we can't
      # hold both credentials at once.  Pull the base image first with the
      # Epic token, then switch to GITHUB_TOKEN for the push.
      - name: Pull Epic UE base image
        run: |
          echo "${{ secrets.EPIC_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/epicgames/unreal-engine:dev-5.5
          docker logout ghcr.io

      # ── Docker metadata (tags + labels) ──────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Decide whether to push ────────────────────────────────────────────
      - name: Should push image?
        id: push-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.push_image }}" = "false" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Log in to GHCR ────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: steps.push-check.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build (and optionally push) Docker image ─────────────────────────
      # The Dockerfile handles both building UE server and packaging into runtime image
      # network=host lets buildx access the pre-pulled Epic image from the host daemon
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: ${{ steps.push-check.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ── Rotate build cache (prevents unbounded growth) ───────────────────
      - name: Rotate build cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
