[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=2702EB584DEC483BCB7BBCBDF79E9C08
ProjectName=Third Person Game Template

[StartupActions]
bAddPacks=True
InsertPack=(PackSource="StarterContent.upack",PackName="StarterContent")

[SectionsToSave]
+Section=StartupActions

[/Script/TurboLinkGrpc.TurboLinkGrpcConfig]
EnableRetries=True
KeepAliveTime=45000
KeepAliveTimeOut=30000
Http2MaxPingsWithoutData=0
KeepAlivePermitWithoutCalls=True
EnableServerSideTLS=False
ServerRootCerts=
; Packaged builds can override these at launch without rebuilding:
;   -GrpcChatEndpoint=play.example.com:50052
;   -GrpcCharacterEndpoint=play.example.com:50053
;   -GrpcDefaultEndpoint=play.example.com:50052
DefaultEndPoint=127.0.0.1:50052
ServiceEndPoint=(("ChatService", "127.0.0.1:50052"),("CharacterService", "127.0.0.1:50053"))
KeepServiceAliveWithoutRefrenceSeconds=60

[/Script/TPSCoreMechanics.GrpcHandlerSubsystem]
; Provide a launch token for non-editor playtests when needed:
;   -AuthToken=<jwt-or-keycloak-json-response>
DefaultAuthToken=

[/Script/TPSCoreMechanics.KeycloakAuthService]
; Packaged builds can override these at launch:
;   -KeycloakUrl=https://play.example.com
;   -KeycloakRealm=idklol
;   -KeycloakClientId=idklol-characters
KeycloakUrl="https://localhost:8080"
RealmName=idklol
ClientId=idklol-characters
bAllowInsecureSSL=True

; ─── Server connection (client-only) ─────────────────────────────────────────
; UServerConnectionSubsystem uses these values when the player enters the game
; from the character selection screen.
[/Script/TPSCoreMechanicsClient.ServerConnectionSubsystem]
; IP:Port of the dedicated game server.
; Override per-environment with -ServerAddress=game.example.com:7777.
ServerAddress=127.0.0.1:7777
; Set to True in DefaultEditor.ini for "Run Under One Process" PIE testing.
; False = ClientTravel to ServerAddress (default for packaged + Docker builds).
bUseOpenLevelFallback=False

[/Script/TPSCoreMechanics.TPSNatsSubjectsConfig]
; Centralized NATS subjects used by TPSCoreMechanics server-side subsystems.
; Override these per environment without code changes.

; Character service
CharactersGetSubject=characters.get

; NPC metadata + runtime commands
NpcSpawnRequestSubject=npc.spawn.request
PlayerContextRequestSubject=server.player_context.get
NpcMetaByZoneSubject=npc.meta.by_zone
NpcMetaListSubject=npc.meta.list
NpcMetaGetSubject=npc.meta.get

; Dedicated server map manager templates (%s = InstanceId)
ServerMapSubjectTemplate="server.%s.map"
ServerStatusSubjectTemplate="server.%s.status"