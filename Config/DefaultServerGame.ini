[/Script/EngineSettings.GameMapsSettings]
; Default map loaded by the dedicated server on startup.
; Override per-instance via the -map= command-line argument or via NATS server.<InstanceId>.map
GameDefaultMap=/Game/ThirdPerson/Maps/ThirdPersonMap

; Server always uses the gameplay game mode — no character creation or selection
GlobalDefaultGameMode=/Script/TPSCoreMechanics.TPSCoreGameMode

[/Script/TPSCoreMechanics.ServerMapManagerSubsystem]
; Override with -InstanceId=<id> on the command line.
; If absent, a GUID is generated at startup.
; DefaultInstanceId=srv-local-01

[NatsClient]
; Connection URL for the NATS broker.
; Override with -NATSUrl=nats://host:4222 on the command line.
DefaultUrl=nats://localhost:4222

; Optional NKey seed or path to .creds file for NATS authentication.
; Leave empty for anonymous connections (development only).
CredentialsOrNKey=

; Timeout in seconds for NATS request/reply calls (character fetch, etc.)
RequestTimeoutSeconds=5.0

[/Script/TPSCoreMechanics.ServerCharacterLoaderSubsystem]
; NATS subject used to request character data from the character service.
; Expected request: {"id":"<CharacterId>"}
; Expected response: {"id":"...","name":"...","race":1,"gender":1,"skin_color":1,"character_class":1,"created_at":"..."}
CharactersGetSubject=characters.get
